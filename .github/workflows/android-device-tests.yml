name: Android device tests
on:
  push:
    paths: ['android/**', '.github/workflows/android-device-tests.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-device-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build application and instrumentation APKs
        run: ./android/gradlew -p android --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Install and test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./android/gradlew -p android --no-daemon :app:connectedDebugAndroidTest
      - name: Upload device test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-api-${{ matrix.api-level }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
